name: ai-blogbot
# re-index trigger

on:
  schedule:
    # 매일 UTC 21:00 (KST 06:00) — Actions 지연(최대 ~1h) 감안해 07~08시 출근길 전에 초안 준비.
    # Blogger(구글 유입)는 준비되는 대로 오전 7~8시 공개, 티스토리(초기엔 다음 유입)는 18:30 예약발행.
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blogbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
        run: python main.py
      - name: posted_ids.json 커밋 (중복게시 이력 유지)
        run: |
          git config user.name "ai-blogbot"
          git config user.email "ai-blogbot@users.noreply.github.com"
          git add posted_ids.json
          git add tistory_drafts/ 2>/dev/null || true
          git add generated_images/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update posted_ids"
          git pull --rebase origin master
          git push
